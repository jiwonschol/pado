name: Public safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-repo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out full public history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reject private metadata and local-only artifacts
        run: bash tools/public-repo-audit.sh

  wip-mirror-proof:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run offline proof
        run: bash tools/wip-mirror/proof.sh
